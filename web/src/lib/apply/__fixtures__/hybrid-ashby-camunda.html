<script>
// Ashby yes/no behavior: pressing one button marks it aria-pressed and
// mirrors the answer into the hidden checkbox.
for (const box of document.querySelectorAll('.ashby-application-form-input-yesno')) {
  const buttons = [...box.querySelectorAll('button[aria-pressed]')];
  const hidden = box.querySelector('input[type=checkbox]');
  for (const b of buttons) b.addEventListener('click', (e) => {
    e.preventDefault();
    buttons.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    hidden.checked = b.dataset.option === 'yes';
  });
}
</script>
