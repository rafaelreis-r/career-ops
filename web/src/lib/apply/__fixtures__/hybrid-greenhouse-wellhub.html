<script>
// Minimal react-select behavior for the captured Greenhouse combobox: typing
// opens a menu of the real option texts filtered by the search text; clicking
// an option renders .select__single-value and clears the search text. With
// window.__INERT set, option clicks are ignored (a widget that never registers
// the selection, as seen on 2026-09-22).
const OPTIONS = ["BRA (+55)","USA (+1)","ARG (+54)","MEX (+52)","CHL (+56)","ESP (+34)","PRT (+351)","DEU (+49)","NLD (+31)","ITA (+39)","GBR (+44)","FRA (+33)"];
const input = document.getElementById('question_37369062002');
const control = input.closest('.select__control');
const valueBox = control.querySelector('.select__value-container');
const shell = control.closest('.select-shell');
function closeMenu() { shell.querySelector('.select__menu')?.remove(); input.setAttribute('aria-expanded', 'false'); }
function openMenu() {
  closeMenu();
  const q = input.value.toLowerCase();
  const menu = document.createElement('div');
  menu.className = 'select__menu';
  const list = document.createElement('div');
  list.className = 'select__menu-list';
  list.setAttribute('role', 'listbox');
  for (const text of OPTIONS.filter((o) => o.toLowerCase().includes(q))) {
    const opt = document.createElement('div');
    opt.className = 'select__option';
    opt.setAttribute('role', 'option');
    opt.textContent = text;
    opt.addEventListener('click', () => {
      window.__clicks = (window.__clicks || 0) + 1;
      if (window.__INERT) return;
      valueBox.querySelector('.select__placeholder')?.remove();
      valueBox.querySelector('.select__single-value')?.remove();
      const single = document.createElement('div');
      single.className = 'select__single-value';
      single.textContent = text;
      valueBox.prepend(single);
      shell.parentElement.querySelector('input[aria-hidden=true][required]')?.remove();
      input.value = '';
      closeMenu();
    });
    list.appendChild(opt);
  }
  menu.appendChild(list);
  control.after(menu);
  input.setAttribute('aria-expanded', 'true');
}
input.addEventListener('input', openMenu);
input.addEventListener('keydown', (e) => { if (e.key === 'Escape') { input.value = ''; closeMenu(); } });
</script>
